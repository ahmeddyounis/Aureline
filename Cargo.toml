[workspace]
resolver = "2"
members = [
    "crates/aureline-chronology",
    "crates/aureline-records",
    "crates/aureline-commands",
    "crates/aureline-input",
    "crates/aureline-ui",
    "crates/aureline-design-system",
    "crates/aureline-shell",
    "crates/aureline-shell-spike",
    "crates/aureline-editor",
    "crates/aureline-render",
    "crates/aureline-text",
    "crates/aureline-buffer",
    "crates/aureline-content-safety",
    "crates/aureline-history",
    "crates/aureline-recovery",
    "crates/aureline-vfs",
    "crates/aureline-rpc",
    "crates/aureline-telemetry",
    "crates/aureline-build-info",
    "crates/aureline-build-farm",
    "crates/aureline-bench",
    "crates/aureline-largefile-proto",
    "crates/aureline-reactive-state",
    "crates/aureline-graph",
    "crates/aureline-graph-ui",
    "crates/aureline-graph-proto",
    "crates/aureline-governance",
    "crates/aureline-ecosystem",
    "crates/aureline-change-objects",
    "crates/aureline-git",
    "crates/aureline-review",
    "crates/aureline-workspace",
    "crates/aureline-scaffold",
    "crates/aureline-templates",
    "crates/aureline-config",
    "crates/aureline-settings",
    "crates/aureline-search",
    "crates/aureline-navigation",
    "crates/aureline-language",
    "crates/aureline-terminal",
    "crates/aureline-debug",
    "crates/aureline-runtime",
    "crates/aureline-auth",
    "crates/aureline-policy",
    "crates/aureline-crash",
    "crates/aureline-support",
    "crates/aureline-release",
    "crates/aureline-notices",
    "crates/aureline-incident",
    "crates/aureline-runbooks",
    "crates/aureline-doctor",
    "crates/aureline-provider",
    "crates/aureline-infra",
    "crates/aureline-extensions",
    "crates/aureline-docs",
    "crates/aureline-i18n",
    "crates/aureline-ai",
    "crates/aureline-preview",
    "crates/aureline-install",
    "crates/aureline-remote",
    "crates/aureline-notebook",
    "crates/aureline-framework",
    "crates/aureline-qe",
    "crates/aureline-capabilities",
    "crates/aureline-collab",
    "crates/aureline-cli",
    "crates/aureline-collections",
    "crates/aureline-deps",
    "crates/aureline-data",
    "crates/aureline-service-health-feed",
    "crates/aureline-service-health",
    "crates/aureline-continuity",
    "crates/aureline-learning",
    "crates/aureline-api",
    "crates/aureline-profiler",
    "crates/aureline-companion",
    "crates/aureline-execution",
    "crates/aureline-service",
    "crates/aureline-env",
    "crates/aureline-generated",
    "crates/aureline-activity",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/ahmeddyounis/Aureline"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
# This workspace has thousands of Cargo targets. Full debug information plus
# per-crate incremental caches makes target/ grow by several gigabytes even
# for a single package. Keep line tables for useful development backtraces,
# but avoid the unbounded incremental cache footprint by default.
debug = 1
incremental = false

[profile.dev.package.objc2]
debug-assertions = false

[profile.test]
# Test executables are especially numerous and short-lived. They do not need
# embedded debug information for the normal validation lane; developers can
# opt back in with CARGO_PROFILE_TEST_DEBUG=2 when debugging a specific test.
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Threshold-change workflow fixture register.
#
# Each fixture below is a single self-describing threshold-change record that is
# either a conforming reference example or a fail-closed negative case. The
# threshold-change validator (ci/check_benchmark_threshold_change.py) reads this
# register, validates every fixture against the threshold-change-record schema,
# applies the per-record admission rules, and asserts the recorded expectation.
#
# These fixtures prove the lane fails closed: an easing with no architecture
# approval, an easing with no release evidence, an open in-force waiver past its
# expiry, a non-default waiver with no expiry or no granting-authority approval,
# inconsistent before/after evidence, a change kind that disagrees with its
# resulting state, a loosen flag on a non-easing, a default waiver that carries a
# grant, an unresolved metric, and a record missing a required field are all
# rejected. Conforming rows resolve to a protected metric in the governance
# matrix and carry the required rationale, evidence, approvals, and expiry.
#
# Planning / milestone slugs MUST NOT appear in any id, path, or note here.

schema_version: 1
register_id: aureline.benchmark_threshold_change_fixtures
register_revision: 1

doc_ref: docs/benchmarks/threshold-change-policy.md
validator_ref: ci/check_benchmark_threshold_change.py
workflow_ref: .github/workflows/check_benchmark_threshold_change.yml
ledger_ref: artifacts/benchmarks/threshold-change-ledger.json
schema_ref: schemas/benchmarks/threshold-change-record.schema.json

canonical_source_refs:
  governance_matrix: artifacts/benchmarks/m5-benchmark-governance.json
  protected_metrics_register: artifacts/bench/protected_metrics.yaml

fixtures:
  - file: fixtures/benchmarks/threshold-change/change_set_calibrated_reference.json
    note: Conforming set-calibrated record on a protected metric; admitted.
  - file: fixtures/benchmarks/threshold-change/change_ease_with_evidence_reference.json
    note: Conforming easing with both approvals, before/after evidence, release evidence, and a time-boxed waiver; admitted.
  - file: fixtures/benchmarks/threshold-change/change_ease_missing_architecture_approval.json
    note: An easing with no architecture-board approval is rejected before a protected bar may loosen.
  - file: fixtures/benchmarks/threshold-change/change_ease_missing_release_evidence.json
    note: An easing with no release-evidence linkage is rejected.
  - file: fixtures/benchmarks/threshold-change/change_expired_open_waiver.json
    note: An open in-force waiver past its expiry blocks promotion.
  - file: fixtures/benchmarks/threshold-change/change_waiver_missing_expiry.json
    note: A non-default waiver with no expiry is rejected; every waiver is time-boxed.
  - file: fixtures/benchmarks/threshold-change/change_waiver_missing_required_approval.json
    note: A non-default waiver granted without its granting authority's approval is rejected.
  - file: fixtures/benchmarks/threshold-change/change_tighten_inconsistent_evidence.json
    note: A change whose after capture predates its before capture is rejected.
  - file: fixtures/benchmarks/threshold-change/change_kind_state_mismatch.json
    note: A change kind that disagrees with its resulting threshold state is rejected.
  - file: fixtures/benchmarks/threshold-change/change_loosen_flag_mismatch.json
    note: A non-easing that flags itself as loosening the protected bar is rejected.
  - file: fixtures/benchmarks/threshold-change/change_default_waiver_carries_grant.json
    note: A class-none waiver that carries a ref, grant date, or expiry is rejected.
  - file: fixtures/benchmarks/threshold-change/change_unknown_metric.json
    note: A change record bound to a metric absent from the matrix is rejected.
  - file: fixtures/benchmarks/threshold-change/change_schema_missing_field.json
    note: A record missing a required field fails closed at the schema boundary.

# Reference-hardware, corpus-manifest, and protected-metric fixture register.
#
# Each fixture below is a single self-describing object record that is either a
# conforming reference example or a fail-closed negative case. The governance
# validator (ci/check_m5_benchmark_governance.py) reads this register, validates
# every fixture against the schema named in its `__fixture__` block, applies the
# identity and self-capture guardrails, and asserts the recorded expectation.
#
# These fixtures prove the lane fails closed: a profile with no display or
# lab-image identity, a corpus on a stale revision, a metric with no corpus, a
# self-capture row claiming a reference baseline, and a claim-bearing metric on
# self-capture hardware are all rejected. Conforming rows resolve to canonical
# reference ids, never to ad hoc local fixtures.
#
# Planning / milestone slugs MUST NOT appear in any id, path, or note here.

schema_version: 1
register_id: aureline.benchmark_reference_hardware_fixtures
register_revision: 1

doc_ref: docs/benchmarks/reference-hardware-and-corpora.md
validator_ref: ci/check_m5_benchmark_governance.py
workflow_ref: .github/workflows/check_m5_benchmark_governance.yml
matrix_ref: artifacts/benchmarks/m5-benchmark-governance.json

schema_refs:
  corpus_manifest: schemas/benchmarks/corpus-manifest.schema.json
  reference_hardware_profile: schemas/benchmarks/reference-hardware-profile.schema.json
  protected_metric: schemas/benchmarks/protected-metric.schema.json

canonical_source_refs:
  corpus_register: fixtures/benchmarks/corpus_manifest.yaml
  reference_hardware_register: artifacts/perf/reference_hardware_manifest.yaml
  lab_image_register: artifacts/perf/lab_image_manifest.yaml
  protected_metrics_register: artifacts/bench/protected_metrics.yaml

fixtures:
  - file: fixtures/benchmarks/reference-hardware/hardware_profile_macos_reference.json
    note: Conforming Apple Silicon reference profile bound to its lab image and council baseline.
  - file: fixtures/benchmarks/reference-hardware/hardware_profile_missing_identity.json
    note: Fails closed at the schema boundary because no display or lab-image identity is bound.
  - file: fixtures/benchmarks/reference-hardware/hardware_profile_self_capture_masquerade.json
    note: A self-capture row claiming an approved reference baseline is rejected by the guardrail.
  - file: fixtures/benchmarks/reference-hardware/corpus_manifest_workflow_reference.json
    note: Conforming workflow corpus on the current revision.
  - file: fixtures/benchmarks/reference-hardware/corpus_manifest_stale_revision.json
    note: A corpus bound behind the current register revision narrows on stale_corpus_revision.
  - file: fixtures/benchmarks/reference-hardware/protected_metric_claim_bearing_reference.json
    note: Conforming claim-bearing metric on a reference profile, lab image, and current corpus.
  - file: fixtures/benchmarks/reference-hardware/protected_metric_missing_corpus.json
    note: Fails closed because no corpus manifest is bound to the metric.
  - file: fixtures/benchmarks/reference-hardware/protected_metric_self_capture_claim.json
    note: A claim-bearing metric on self-capture hardware is rejected by the guardrail.

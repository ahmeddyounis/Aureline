# Public-comparison reproducibility pack fixture register.
#
# Each fixture below is a single self-describing reproducibility pack that is
# either a conforming reference example or a fail-closed negative case. The
# public-comparison validator (ci/check_public_comparison_pack.py) reads this
# register, validates every fixture against the public-comparison-pack schema,
# applies the per-pack admission rules against the benchmark-governance matrix,
# and asserts the recorded expectation.
#
# These fixtures prove the lane fails closed: a claim-bearing pack with no raw
# configuration, no environment metadata, no retained raw-run metadata, no
# reproduction recipe, or an undisclosed required field; a head-to-head pack with
# no competitor disclosure; a pack whose posture, metric set, or hardware
# identity disagrees with its governance publication pack; a non-claim-bearing
# pack that authorizes a public surface; a pack bound to a publication pack absent
# from the matrix; an expired claim-bearing pack; and a record missing a required
# field are all rejected. Conforming rows resolve to a governance publication pack
# and carry the required raw configuration, environment, reproduction, and
# disclosure.
#
# Planning / milestone slugs MUST NOT appear in any id, path, or note here.

schema_version: 1
register_id: aureline.benchmark_public_comparison_pack_fixtures
register_revision: 1

doc_ref: docs/benchmarks/public-comparison-packs.md
validator_ref: ci/check_public_comparison_pack.py
workflow_ref: .github/workflows/check_public_comparison_pack.yml
register_artifact_ref: artifacts/benchmarks/public-comparison-pack-register.json
schema_ref: schemas/benchmarks/public-comparison-pack.schema.json

canonical_source_refs:
  governance_matrix: artifacts/benchmarks/m5-benchmark-governance.json
  corpus_manifest: fixtures/benchmarks/corpus_manifest.yaml

fixtures:
  - file: fixtures/benchmarks/public-comparison/pack_methodology_reference.json
    note: Conforming methodology-only pack bound to the methodology publication pack; admitted.
  - file: fixtures/benchmarks/public-comparison/pack_aureline_only_reference.json
    note: Conforming Aureline-only claim pack with raw config, environment, run metadata, and reproduction; admitted.
  - file: fixtures/benchmarks/public-comparison/pack_head_to_head_reference.json
    note: Conforming head-to-head pack with full disclosure and competitor parity; admitted.
  - file: fixtures/benchmarks/public-comparison/pack_governance_pack_unresolved.json
    note: A pack bound to a publication pack absent from the governance matrix is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_posture_mismatch.json
    note: A pack whose posture disagrees with its governance publication pack is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_metric_refs_mismatch.json
    note: A pack that does not cover the governance publication pack's metric set is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_hardware_identity_mismatch.json
    note: A pack whose hardware or lab-image identity disagrees with its governance publication pack is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_undisclosed_required_field.json
    note: A head-to-head pack that omits a required disclosure field is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_non_claim_surface_scope.json
    note: A non-claim-bearing pack that authorizes a public surface is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_missing_raw_configuration.json
    note: A claim-bearing pack with no exact command line or build identity is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_missing_environment_metadata.json
    note: A claim-bearing pack with no power/thermal posture or environment notes is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_missing_raw_run_metadata.json
    note: A claim-bearing pack with no retained raw-run metadata is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_missing_reproduction_recipe.json
    note: A claim-bearing pack with no reproduction steps or rerun recipe is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_missing_comparison_disclosure.json
    note: A head-to-head pack with no competitor or task-parity disclosure is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_expired_freshness.json
    note: A claim-bearing pack past its freshness window is rejected.
  - file: fixtures/benchmarks/public-comparison/pack_schema_missing_field.json
    note: A record missing a required field fails closed at the schema boundary.

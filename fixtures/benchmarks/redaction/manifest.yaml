# Corpus-intake / redaction fixture register.
#
# Each fixture below is a single self-describing corpus-intake record that is
# either a conforming reference example or a fail-closed negative case. The
# corpus-intake validator (ci/check_benchmark_corpus_intake.py) reads this
# register, validates every fixture against the corpus-intake-record schema,
# applies the per-record admission rules, and asserts the recorded expectation.
#
# These fixtures prove the lane fails closed: real data that is not materialised,
# an origin/sensitivity mismatch, an uncleared license, a closed decision that
# leaves a corpus admitted, an admitted corpus with no approved decision, a
# blocked corpus claiming a protected use, a sensitive corpus missing its
# data-steward or privacy review, a licensed corpus missing legal clearance,
# pending or impossible redaction riding into real-data CI, an unmarked,
# unavailable, or unresolved synthetic fallback, a sensitive corpus that is not
# time-boxed, an overdue retention window, and a record missing a required field
# are all rejected. Conforming rows resolve their real data or synthetic fallback
# to the canonical corpus register and carry an approved intake decision.
#
# Planning / milestone slugs MUST NOT appear in any id, path, or note here.

schema_version: 1
register_id: aureline.benchmark_corpus_intake_fixtures
register_revision: 1

doc_ref: docs/benchmarks/corpus-intake-and-redaction.md
policy_ref: artifacts/benchmarks/corpus-intake-policy.md
validator_ref: ci/check_benchmark_corpus_intake.py
workflow_ref: .github/workflows/check_benchmark_corpus_intake.yml
ledger_ref: artifacts/benchmarks/corpus-intake-ledger.json
schema_ref: schemas/benchmarks/corpus-intake-record.schema.json

canonical_source_refs:
  governance_matrix: artifacts/benchmarks/m5-benchmark-governance.json
  corpus_register: fixtures/benchmarks/corpus_manifest.yaml

fixtures:
  - file: fixtures/benchmarks/redaction/corpus_intake_non_sensitive_reference.json
    note: Conforming non-sensitive original corpus admitted for real-data protected CI; admitted.
  - file: fixtures/benchmarks/redaction/corpus_intake_synthetic_fallback_reference.json
    note: Conforming partner-confidential corpus admitted synthetic-only with an available fallback; admitted.
  - file: fixtures/benchmarks/redaction/corpus_intake_real_corpus_not_materialized.json
    note: Real-data admission whose corpus id is absent from the corpus register is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_origin_sensitivity_inconsistent.json
    note: A synthetic corpus claiming a customer-confidential sensitivity class is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_license_not_cleared.json
    note: A vendored corpus with an uncleared license cannot enter a protected lane.
  - file: fixtures/benchmarks/redaction/corpus_intake_rejected_not_blocked.json
    note: A rejected intake decision that leaves the corpus admitted is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_unapproved_real_data.json
    note: A real-data admission with only a proposed intake decision is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_blocked_claims_protected_use.json
    note: A blocked corpus that claims a protected_ci_gate use is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_sensitive_missing_review.json
    note: A sensitive corpus missing its privacy review is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_licensed_missing_legal.json
    note: A licensed corpus missing legal-review clearance is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_redaction_pending_real_data.json
    note: Pending redaction cannot ride into real-data CI.
  - file: fixtures/benchmarks/redaction/corpus_intake_unredactable_real_data.json
    note: Unredactable content cannot be admitted as real data.
  - file: fixtures/benchmarks/redaction/corpus_intake_synthetic_fallback_not_marked.json
    note: A synthetic-only admission that does not mark a required fallback is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_synthetic_fallback_unavailable.json
    note: A required synthetic fallback that is not available is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_synthetic_fallback_unresolved.json
    note: A synthetic fallback pointing at a non-canonical corpus id is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_retention_posture_missing.json
    note: A sensitive corpus that is not time-boxed with a purge date is rejected.
  - file: fixtures/benchmarks/redaction/corpus_intake_retention_overdue.json
    note: An admitted sensitive corpus past its purge-due date fails closed.
  - file: fixtures/benchmarks/redaction/corpus_intake_schema_missing_field.json
    note: A record missing a required field fails closed at the schema boundary.

notes:
  - Canonical M5 search/navigation certification index that proves the four search/docs/graph depth lanes (query-session identity, ranking explainability, saved-query privacy, navigation continuity) carry current evidence, sitting above the qualification matrix to answer whether its proof is current.
  - Each lane row cites its own evidence packet id, boundary schema, reviewer doc, review artifact, fixture corpus, and record kind together with that evidence's freshness and recheck deadline; a lane may never borrow an adjacent lane's proof.
  - The certification state is derived fail-closed across the closed certified / retest_pending / limited / unsupported vocabulary, and a per-lane cross-surface parity audit catches any product, CLI/headless, docs/help, or support-export surface that overclaims a greener state than the lane proves.
  - Degraded fixtures prove the auto-narrowing: stale navigation-continuity evidence fails closed to retest_pending, a degraded ranking source with a broken support-export parity fails closed to limited, and missing saved-query-privacy evidence fails closed to unsupported, while the remaining lanes stay certified.

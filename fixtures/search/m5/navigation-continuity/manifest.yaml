notes:
  - Binds breadcrumb, outline, bookmark, recent-location, back/forward, and peek artifacts to canonical anchors across the editor, diff, notebook, docs, search, and graph surfaces; the drift-state, surface, and artifact-kind vocabulary is reused verbatim from aureline-navigation, and result-bearing surfaces bind to the durable, surface-independent search result identity.
  - Keeps drift visible instead of silent relocation; drifted, missing-target, scope-unavailable, and archived artifacts keep a reason plus recovery choices and never carry a resolved target, and used_nearby_fallback is always false. A remap binds to the canonical anchor first and follows stable evidence to a different target.
  - History entries declare exactly one back/forward/recent role and keep an origin anchor distinct from the destination; peek keeps a return anchor. The packet stays metadata-only with hash-only session refs and never widens authority.
  - The restore projection preserves several non-resolving artifacts (drifted, scope-unavailable, missing-target) with a visible reason and recovery choices, proving continuity reopens after restart instead of being dropped.
  - The same continuity objects are reused by the product UI, back/forward history, session restore, and support replay consumers, so back/forward and a support bundle inspect the exact recorded artifact without guessing from UI text.
  - The workset_drift fixture proves a further-narrowed workset turns a previously bound search bookmark into a visible, recoverable drifted artifact (strictly more unresolved artifacts) while the vocabulary, the artifact identities, and the reused continuity objects are preserved; the drifted bookmark survives restore with a visible reason.

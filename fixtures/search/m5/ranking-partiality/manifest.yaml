manifest_id: search.m5.ranking_explainability.v1
schema_version: 1
contract_page: docs/search/ranking-explainability.md
artifact_review_page: artifacts/search/m5/ranking-explainability.md
schema_ref: schemas/search/ranking-explainability.schema.json
crate_consumer: crates/aureline-search/src/ranking_explainability/mod.rs
shell_consumer: crates/aureline-shell/src/search/search_debug_sheet.rs
fixture_files:
  - fixtures/search/m5/ranking-partiality/packet.json
  - fixtures/search/m5/ranking-partiality/partial_index_stale.json
notes:
  - Promotes ranking reasons into user-visible Why this result? explain sheets across palette, sidebar, docs results, graph-backed results, and saved-query reopen; each sheet reuses the canonical RankingReason object verbatim and excludes raw numeric score weights.
  - Makes withheld-latency, policy-hidden, and partial-index candidates inspectable as controlled omitted-candidate rows instead of silent omissions; a non-zero policy or latency scope counter must be explained by a matching omission row.
  - Keeps the six fact labels (exact, context_promoted, semantic, partial_index, withheld_latency, policy_hidden) and the six explainer states (promoted, suppressed, tied, partial_index, withheld_latency, policy_hidden) distinguishable and realized by at least one row.
  - The same explanation object is reused by the product UI, support export, and replay/debug consumers; the packet stays metadata-only with hash-only session refs and no literal query text unless export consent is elevated.
  - The degraded fixture proves a partial/stale index narrows semantic coverage and withholds strictly more candidates for latency or pending indexing while result identity, the explainer vocabulary, and the reused explanation object are preserved; saved-query reopen reads local material and stays unchanged.

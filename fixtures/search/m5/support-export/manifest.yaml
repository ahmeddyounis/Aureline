notes:
  - Binds the canonical per-export SearchExportPacket verbatim — query-session ref, selected and included result refs, loaded/hidden counts, redaction mode, snapshot truth, and evidence refs — to the export class it ships under and the literal-query consent gate that governs it, with one row per export class (local replay, support bundle, incident packet, managed analytics) realizing the full redaction-state and consent vocabulary.
  - Proves support exports and incident packets explain what search ran, what was selected, and what was omitted using query hashes, scope summaries, result refs, and omission counts, without storing literal query text by default; only the local-replay row retains a literal, gated behind explicit elevated consent and a class that never leaves the device, and managed analytics carries neither literal nor hash query material.
  - Proves every export packet is replay-safe: a captured snapshot or a disclosed scope drift, never a live rerun, that preserves intent and provenance and reruns before claiming current truth; the incident row discloses a scope drift that must rerun.
  - Proves desktop, CLI/headless, support export, and managed analytics consumers read the same export packets under the same privacy rules — preserving redaction mode, count and omission disclosure, and replay safety — without one path widening retention of raw query text or result bodies.
  - The redacted_export.json fixture proves the support/incident export copy carries no literal query text while hashes, scope metadata, result refs, counts, and replay-safety truth are preserved unchanged.

manifest_id: search.m5.action_bindings.v1
schema_version: 1
contract_page: docs/search/action-bindings.md
artifact_review_page: artifacts/search/m5/action-bindings.md
schema_ref: schemas/search/action-binding.schema.json
crate_consumer: crates/aureline-search/src/action_bindings/mod.rs
shell_consumer: crates/aureline-shell/src/navigation_targets/mod.rs
fixture_files:
  - fixtures/search/m5/navigation-targets/packet.json
  - fixtures/search/m5/navigation-targets/scope_trust_narrowed.json
notes:
  - Binds preview, open-in-place, split, peek, and external-handoff actions to canonical result refs and navigation relation kinds across search results, docs results, graph-backed results, history/back-forward replay, and support handoff replay; each binding embeds the canonical SearchActionBinding verbatim and reuses the navigation RelationKind.
  - Keeps definition and declaration distinguishable and proves a definition jump never silently becomes a declaration jump; a relation-kind degrade carries an explicit, recoverable WrongTargetFallback with a visible reason, and a local-to-browser docs handoff uses the external_handoff action with a visible reason.
  - Split, peek, and open-in-place preserve attributable target refs and a return anchor distinct from the open target; convenience routing never widens authority and the packet stays metadata-only with hash-only session refs.
  - The same binding objects are reused by the product UI, history/back-forward, and support replay consumers, so back/forward and a support bundle inspect the exact action that was launched without guessing from UI text.
  - The degraded fixture proves a further-narrowed scope/trust/freshness posture turns a previously direct search-results action into an explicit, recoverable fallback (strictly more fallbacks) while the action-kind, relation-kind, and fallback-trigger vocabulary, the result identity, and the reused binding objects are preserved; history replay reads local material and stays unchanged.

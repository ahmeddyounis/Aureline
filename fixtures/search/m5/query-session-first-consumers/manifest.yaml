notes:
  - Materializes one durable hash-only query session per search surface (quick open, symbol search, full-text search, references, docs search, recent navigation) and binds materialized result identities with full source-stratum dedupe lineage, structured ranking reasons, and explicit action bindings.
  - Proves cross-surface result-identity reuse and that the four first consumers (desktop, CLI/headless inspect, AI context assembly, support export) reuse the same session and result ids verbatim instead of reconstructing state from rendered UI text or inventing private candidate lists.
  - Result identity is a durable, surface-independent URN that never collapses into a display label or transient list index and survives row virtualization, preview-pane toggles, reason-chip toggles, and pane restore.
  - The degraded fixture proves a partial/stale index narrows every live-retrieval surface to a partial-index claim while result identity and source-stratum lineage are preserved unchanged and local recent navigation stays live; the packet stays metadata-only with no raw query text, source bodies, provider payloads, or secrets.

notes:
  - Binds the canonical SavedQuery, ScopePackBinding, QueryHistoryEntry, and SearchDeepLink artifacts into one governance packet, with a row per privacy class and the full sync, retention, and redaction vocabulary realized across the artifacts and the local-versus-synced retention matrix.
  - Proves saved queries and query history survive reopen, migration, and scope drift without silent semantic breakage; every row keeps silent_semantic_break = false, one row is migrated_from_previous_version, and one discloses a current_scope_changed_rebind_required drift that reruns before claiming truth.
  - Wraps each search deep link with a tamper-evident content signature over the disclosed intent, completeness note, scope, freshness, and return anchor; the link reopens intent under the recipient's own permissions, never implies live current certainty, and never widens access.
  - Certifies that raw query text stays local-only by default — only the local-only-private row keeps a literal, the raw_query_text retention row is never synced by default, and any widening carries an explicit basis with the explicit_literal_consent redaction profile.
  - The redacted_export.json fixture proves the support/sync export copy carries no raw query text while hashes, scope metadata, captured-vs-current scope truth, and the signed deep links are preserved unchanged.

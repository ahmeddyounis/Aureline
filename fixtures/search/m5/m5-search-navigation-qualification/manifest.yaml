notes:
  - Canonical M5 search/navigation qualification index freezing the search-query, result-identity, ranking-reason, and saved-query/privacy matrix into one shared decision surface across the product and CLI/headless deployment modes.
  - Every claimed search surface row references the one shared query-session and result-identity model and binds the canonical contract objects (SearchQuerySession, SearchResultRef, RankingReason, SearchActionBinding, SavedQuery, scope-pack, export packet) to their own lane schema, fixture corpus, and record kind.
  - The closed result-state vocabulary (exact, context_promoted, semantic, partial_index, withheld_latency, policy_hidden, cached, stale, imported) and the privacy/retention/consent posture for raw query text, query hashes, saved-query sync, and support/export packets are frozen here.
  - Degraded fixtures prove a partial/stale index narrows every live-retrieval surface to scope_limited while durable-artifact surfaces stay qualified, and missing query-material consent narrows the persisting surfaces to local_query_text_only while keeping local-only query text first-class.

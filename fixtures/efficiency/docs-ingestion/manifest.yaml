# Efficiency publication-ingestion fixture register.
#
# Each fixture below is a single self-describing ingestion binding that is either
# a conforming reference example or a fail-closed negative case. The efficiency
# publication-ingestion validator (ci/check_efficiency_publication_ingestion.py)
# reads this register, validates every fixture against the publication-ingestion
# schema, applies the per-binding admission rules against the canonical M5
# efficiency-state governance matrix, and asserts the recorded expectation.
#
# These fixtures prove the lane fails closed: a binding that admits it does not
# render verbatim, points at an unknown entry, advertises an unsupported claim on
# the About surface, discloses a forbidden raw-telemetry field or a field outside
# the export-safe allowlist, renders a posture, effective posture, override
# posture, or claim-support level that differs from the entry, or omits a required
# field are all rejected. Conforming bindings resolve to a governance-matrix row
# and render its posture, narrowed effective posture, certification state,
# claim-support level, override posture, and recovery state verbatim with only
# export-safe fields.
#
# Planning / milestone slugs MUST NOT appear in any id, path, or note here.

schema_version: 1
register_id: aureline.efficiency_publication_ingestion_fixtures
register_revision: 1

doc_ref: docs/efficiency/publication-ingestion.md
validator_ref: ci/check_efficiency_publication_ingestion.py
workflow_ref: .github/workflows/check_efficiency_publication_ingestion.yml
register_artifact_ref: artifacts/efficiency/publication-ingestion-register.json
schema_ref: schemas/efficiency/publication-ingestion.schema.json

canonical_source_refs:
  governance_matrix: artifacts/efficiency/m5-efficiency-governance.json
  admin_surface_fields: artifacts/efficiency/admin-surface-fields.md

fixtures:
  - file: fixtures/efficiency/docs-ingestion/binding_docs_reference.json
    note: Conforming docs binding rendering the certified notebook entry verbatim; admitted.
  - file: fixtures/efficiency/docs-ingestion/binding_admin_reference.json
    note: Conforming admin binding rendering the entry's posture and override rules; admitted.
  - file: fixtures/efficiency/docs-ingestion/binding_support_export_reference.json
    note: Conforming support-export binding rendering the entry's export-safe projection; admitted.
  - file: fixtures/efficiency/docs-ingestion/binding_about_claim_bearing.json
    note: Conforming About binding on a claim-bearing entry; admitted.
  - file: fixtures/efficiency/docs-ingestion/binding_unsupported_docs_reference.json
    note: Conforming docs binding rendering a quarantined entry as unsupported; admitted.
  - file: fixtures/efficiency/docs-ingestion/binding_not_verbatim.json
    note: Negative; renders_verbatim_from_entry is false.
  - file: fixtures/efficiency/docs-ingestion/binding_entry_unresolved.json
    note: Negative; consumes_entry_id is not a governance-matrix row.
  - file: fixtures/efficiency/docs-ingestion/binding_about_unsupported.json
    note: Negative; About is bound to a quarantined entry.
  - file: fixtures/efficiency/docs-ingestion/binding_forbidden_field.json
    note: Negative; discloses a forbidden raw-telemetry field.
  - file: fixtures/efficiency/docs-ingestion/binding_not_export_safe_field.json
    note: Negative; discloses a field outside the export-safe allowlist.
  - file: fixtures/efficiency/docs-ingestion/binding_posture_mismatch.json
    note: Negative; renders a posture different from the entry.
  - file: fixtures/efficiency/docs-ingestion/binding_effective_posture_overclaim.json
    note: Negative; re-inflates a quarantined entry's effective posture.
  - file: fixtures/efficiency/docs-ingestion/binding_override_posture_mismatch.json
    note: Negative; renders an override posture different from the entry.
  - file: fixtures/efficiency/docs-ingestion/binding_claim_support_mismatch.json
    note: Negative; renders a claim-support level different from the entry's certification state.
  - file: fixtures/efficiency/docs-ingestion/binding_schema_missing_field.json
    note: Negative; omits a required field and fails the schema.

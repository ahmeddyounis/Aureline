# Pin / retention manager for a workspace holding crash evidence, a review
# packet, a support-export assembly in flight, a replay bundle under a
# retention window, and a user checkpoint. Every pin states its source, who
# pinned it, the expiry/policy window, the referenced object, the unpin path,
# and the export-before-delete path. The cleanup history keeps a disposable
# preview trim and an evidence retention-expiry attributable; the case pin
# blocks the evidence expiry so pinned evidence is retained.
record_kind: m5_pin_retention_manager
schema_version: 1
manager_id: pin_retention.evidence_and_checkpoints.v1
emitted_at: 2026-06-14T00:00:00Z
scope_ref: ws.alpha
scope_label: Project Alpha
surfaces:
- pin_manager
- cleanup_history_lane
pins:
- record_kind: m5_pin_retention_pin
  pin_id: pin.review_evidence.alpha
  label: Incident review packet — auth regression
  family_id: review_incident_evidence
  storage_class_id: evidence_support_cache
  pin_source: review_pack_ref
  pin_actor: review_process
  pinned_by_ref: role.reviewer
  referenced_object_class: review_packet
  referenced_object_ref: review_pack.auth_regression.v3
  default_retention_class: retain_for_policy_window
  retention_state: pinned_indefinite_while_referenced

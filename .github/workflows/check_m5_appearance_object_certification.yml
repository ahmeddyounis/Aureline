# M5 appearance-object certification gate.
#
# Validates the checked-in appearance-object certification: the canonical
# object-model index registers all five appearance-object families, every
# claimed M5 surface is certified across all five, each family certification is
# backed by its canonical source report, the certified claim scope is the
# derived auto-narrowed value, and no surface keeps a full claim while an
# underlying object is missing, stale, or hiding a downgrade. The typed Rust
# consumer mints the same report, so `cargo test -p aureline-shell` enforces the
# same structural invariants and that the fixtures are bit-for-bit equal to the
# seed.

name: check_m5_appearance_object_certification

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_appearance_object_certification.yml"
      - "tools/ci/m5/appearance_object_certification_check.py"
      - "schemas/ux/m5-appearance-object-certification.schema.json"
      - "docs/m5/appearance-object-certification.md"
      - "artifacts/ux/m5/theme-package-certification/**"
      - "fixtures/ux/m5/appearance-object-certification/**"
      - "crates/aureline-shell/src/appearance_object_certification/**"
      - "crates/aureline-shell/src/bin/aureline_shell_m5_appearance_object_certification.rs"
      - "crates/aureline-shell/src/lib.rs"
      - "crates/aureline-shell/tests/m5_appearance_object_certification_fixtures.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-appearance-object-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_appearance_object_certification:
    name: M5 appearance-object certification
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 appearance-object certification CI gate
        run: |
          python3 tools/ci/m5/appearance_object_certification_check.py --repo-root .

      - name: Run M5 appearance-object certification contract tests
        run: |
          cargo test -p aureline-shell --test m5_appearance_object_certification_fixtures

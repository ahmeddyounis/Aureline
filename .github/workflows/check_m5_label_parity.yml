# M5 automation-label cross-surface parity gate.
#
# Validates the checked-in automation-label parity packet: the canonical packet
# binds every claimed M5 command to one source label set and one projection per
# surface (command palette row, recipe builder, macro recorder, docs/help,
# CLI/headless inspect, support export, and release/public-truth), lists the full
# frozen vocabulary, and keeps every surface projecting the same stable ids and
# canonical display tokens with no synonyms and no dropped side-effect labels; the
# support export and CLI/headless view stay consistent; and every mutation fixture
# blocks stable. The typed Rust consumer mints the same packet, so
# `cargo test -p aureline-runtime` enforces the same invariants and that the
# fixtures and artifacts are bit-for-bit derivable from the seed.

name: check_m5_label_parity

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_label_parity.yml"
      - "tools/ci/m5/label_parity_check.py"
      - "schemas/automation/automation-labels.schema.json"
      - "schemas/automation/automation-contract-baseline.schema.json"
      - "docs/m5/automation-safety-labels.md"
      - "artifacts/m5/automation/label-parity/**"
      - "fixtures/automation/m5/label-parity/**"
      - "crates/aureline-runtime/src/m5_label_parity/**"
      - "crates/aureline-runtime/examples/dump_m5_label_parity.rs"
      - "crates/aureline-runtime/src/lib.rs"
      - "crates/aureline-runtime/tests/m5_label_parity.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-label-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_label_parity:
    name: M5 automation-label parity
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 automation-label parity CI gate
        run: |
          python3 tools/ci/m5/label_parity_check.py --repo-root .

      - name: Run M5 automation-label parity contract tests
        run: |
          cargo test -p aureline-runtime --test m5_label_parity

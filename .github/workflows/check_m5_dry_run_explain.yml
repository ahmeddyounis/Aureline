# M5 dry-run/explain first-consumers gate.
#
# Validates the checked-in reusable dry-run/explain preview object and its first
# consumers: the canonical packet binds all six first-consumer entrypoints
# (notebook, task/test/debug, request/API, package, incident, and the AI
# assistant) to a seeded preview where every predicted write is declared, every
# process/network/remote action is labeled, every trust/policy blocker is
# visible, every artifact destination is named, and the frozen packet projection
# (outcome, label union, and per-step explanation) stays consistent with the live
# actions; the support export carries the attributable run-history rows; the
# CLI/headless view and compact projection stay consistent; the worked-example
# preview export, blocked preview, and survival demonstration exist; and every
# mutation fixture blocks stable. The typed Rust consumer mints the same packet,
# so `cargo test -p aureline-runtime` enforces the same invariants and that the
# fixtures and artifacts are bit-for-bit derivable from the seed.

name: check_m5_dry_run_explain

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_dry_run_explain.yml"
      - "tools/ci/m5/dry_run_explain_check.py"
      - "schemas/automation/dry-run-explain.schema.json"
      - "schemas/automation/recipe-builder.schema.json"
      - "docs/m5/dry-run-and-explain.md"
      - "artifacts/m5/automation/dry-run-explain/**"
      - "fixtures/automation/m5/side-effect-preview/**"
      - "crates/aureline-runtime/src/dry_run_explain/**"
      - "crates/aureline-runtime/examples/dump_m5_dry_run_explain.rs"
      - "crates/aureline-runtime/src/lib.rs"
      - "crates/aureline-runtime/tests/m5_dry_run_explain.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-dry-run-explain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_dry_run_explain:
    name: M5 dry-run explain first consumers
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 dry-run/explain first-consumers CI gate
        run: |
          python3 tools/ci/m5/dry_run_explain_check.py --repo-root .

      - name: Run M5 dry-run/explain first-consumers contract tests
        run: |
          cargo test -p aureline-runtime --test m5_dry_run_explain

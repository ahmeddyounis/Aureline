# M5 parameter-review first-consumers gate.
#
# Validates the checked-in typed parameter-review object and its first consumers:
# the canonical packet binds all six first-consumer entrypoints (notebook,
# task/test/debug, request/API, package, incident, and the AI assistant) to a
# seeded sheet where every parameter is typed with an explicit source layer,
# every secret value is held as a reference, every save scope is in its allowed
# set, and the frozen sheet projection stays consistent with the live parameters;
# the support export, CLI/headless view, and compact projection stay consistent;
# the worked-example sheet export, secret-reference sheet, and rerun demonstration
# exist; and every mutation fixture blocks stable. The typed Rust consumer mints
# the same packet, so `cargo test -p aureline-runtime` enforces the same
# invariants and that the fixtures and artifacts are bit-for-bit derivable from
# the seed.

name: check_m5_parameter_review

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_parameter_review.yml"
      - "tools/ci/m5/parameter_review_check.py"
      - "schemas/automation/parameter-review.schema.json"
      - "schemas/automation/recipe-builder.schema.json"
      - "docs/m5/parameter-review-and-secret-references.md"
      - "artifacts/m5/automation/parameter-review/**"
      - "fixtures/automation/m5/parameter-review/**"
      - "crates/aureline-runtime/src/parameter_review/**"
      - "crates/aureline-runtime/examples/dump_m5_parameter_review.rs"
      - "crates/aureline-runtime/src/lib.rs"
      - "crates/aureline-runtime/tests/m5_parameter_review.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-parameter-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_parameter_review:
    name: M5 parameter review first consumers
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 parameter-review first-consumers CI gate
        run: |
          python3 tools/ci/m5/parameter_review_check.py --repo-root .

      - name: Run M5 parameter-review first-consumers contract tests
        run: |
          cargo test -p aureline-runtime --test m5_parameter_review

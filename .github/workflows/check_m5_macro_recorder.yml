# M5 macro-recorder session and replay first-consumers gate.
#
# Validates the checked-in macro-recorder session and replay object and its first
# consumers: the canonical packet binds all six first-consumer entrypoints
# (notebook, task/test/debug, request/API, package, incident, and the AI assistant)
# to a seeded panel where every session declares its target and storage scope, the
# replay action recomputed from the import state and observed current-replay
# blockers matches the projected replay resolution, recorded macros stay
# profile-local, unsupported commands are flagged and block save, replay fails
# closed on a context or scope mismatch, repository content defines no macro,
# cross-scope promotion is explicit, and captures stay UI-only; the support export
# carries the resolved replay resolutions; the CLI/headless view and compact
# projection stay consistent; the worked-example export round-trip, cross-scope
# promotion, unsupported-command block, and fail-closed replay exist; and every
# mutation fixture blocks stable. The typed Rust consumer mints the same packet, so
# `cargo test -p aureline-runtime` enforces the same invariants and that the
# fixtures and artifacts are bit-for-bit derivable from the seed.

name: check_m5_macro_recorder

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_macro_recorder.yml"
      - "tools/ci/m5/macro_recorder_check.py"
      - "schemas/automation/macro-recorder.schema.json"
      - "schemas/automation/macro-session.schema.json"
      - "docs/m5/macro-recorder-and-replay.md"
      - "artifacts/m5/automation/macro-recorder/**"
      - "fixtures/automation/m5/macro-recorder/**"
      - "crates/aureline-runtime/src/macro_sessions/**"
      - "crates/aureline-runtime/examples/dump_m5_macro_recorder.rs"
      - "crates/aureline-runtime/src/lib.rs"
      - "crates/aureline-runtime/tests/m5_macro_recorder.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-macro-recorder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_macro_recorder:
    name: M5 macro-recorder first consumers
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 macro-recorder first-consumers CI gate
        run: |
          python3 tools/ci/m5/macro_recorder_check.py --repo-root .

      - name: Run M5 macro-recorder first-consumers contract tests
        run: |
          cargo test -p aureline-runtime --test m5_macro_recorder

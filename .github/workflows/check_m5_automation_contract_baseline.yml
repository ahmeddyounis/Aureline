# M5 automation contract-baseline gate.
#
# Validates the checked-in automation contract baseline: the canonical packet
# binds all six automation object families (recipe builder, parameter review,
# dry-run/explain, run history, macro recorder, and safety labels), reuses the
# whole controlled-automation-label safety-label vocabulary, keeps every freeze
# invariant true, and promotes to stable; the support export, CLI/headless view,
# safety-label manifest, and compact projection stay consistent; the worked-example
# recipe-macro fixtures exist; and every baseline mutation fixture blocks stable.
# The typed Rust consumer mints the same packet, so `cargo test -p aureline-runtime`
# enforces the same invariants and that the fixtures and artifacts are bit-for-bit
# derivable from the seed.

name: check_m5_automation_contract_baseline

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_automation_contract_baseline.yml"
      - "tools/ci/m5/automation_contract_baseline_check.py"
      - "schemas/automation/recipe-builder.schema.json"
      - "schemas/automation/macro-session.schema.json"
      - "schemas/automation/automation-contract-baseline.schema.json"
      - "docs/m5/recipe-builder-and-macro-contract.md"
      - "artifacts/m5/automation/automation-contract-baseline/**"
      - "fixtures/automation/m5/recipe-macro/**"
      - "fixtures/automation/m5/automation-contract-baseline/**"
      - "crates/aureline-runtime/src/m5_automation_contract_baseline/**"
      - "crates/aureline-runtime/examples/dump_m5_automation_contract_baseline.rs"
      - "crates/aureline-runtime/src/lib.rs"
      - "crates/aureline-runtime/tests/m5_automation_contract_baseline.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-automation-contract-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_automation_contract_baseline:
    name: M5 automation contract baseline
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 automation contract-baseline CI gate
        run: |
          python3 tools/ci/m5/automation_contract_baseline_check.py --repo-root .

      - name: Run M5 automation contract-baseline contract tests
        run: |
          cargo test -p aureline-runtime --test m5_automation_contract_baseline

# Native-desktop per-desktop-profile qualification family gate.
#
# Validates the checked-in native-desktop qualification family: every claimed
# desktop profile (platform x delivery channel) binds the seven canonical
# qualification dimensions (channel/build ownership, protocol-handler ownership,
# file-association ownership, reopen fidelity, notification privacy,
# external-root recovery, store-lock recovery) to the platform-conformance drill
# it is qualified by (channel-ownership audit, handler conflict, wrong-target
# reopen, lock-screen privacy, missing-root recovery, store lock); every
# qualified dimension carries its drill ref and an evidence pack that names its
# own profile so no row borrows another profile's or channel's proof; no
# dimension is failed (so the distinct failure classes -- ownership unprovable, a
# protocol-handler conflict, a file-association conflict, a wrong-target reopen,
# a lock-screen leak, a missing-root silent loss, and a store-lock dead end --
# all stay distinct, caught classes); a marketed profile whose evidence is stale
# narrows instead of publishing as implicitly stable; and each profile's
# published claim is derived from its dimension qualification so the claim can
# never be greener than the proof. The typed Rust consumer mints the same
# records, so `cargo test -p aureline-shell` enforces the same structural
# invariants and that the fixtures are bit-for-bit equal to the seed.

name: check_m5_native_desktop_qualification

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_native_desktop_qualification.yml"
      - "tools/ci/m5/native_desktop_qualification_check.py"
      - "schemas/platform/m5-native-desktop-qualification.schema.json"
      - "docs/m5/native-desktop-qualification.md"
      - "artifacts/platform/m5-native-desktop-qualification/**"
      - "artifacts/shiproom/m5-native-desktop-claim-packet/**"
      - "fixtures/platform/m5-native-desktop-qualification/**"
      - "crates/aureline-shell/src/m5_native_desktop_qualification/**"
      - "crates/aureline-shell/src/bin/aureline_shell_m5_native_desktop_qualification.rs"
      - "crates/aureline-shell/src/lib.rs"
      - "crates/aureline-shell/tests/m5_native_desktop_qualification_fixtures.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-native-desktop-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_native_desktop_qualification:
    name: M5 native desktop qualification
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 native-desktop qualification CI gate
        run: |
          python3 tools/ci/m5/native_desktop_qualification_check.py --repo-root .

      - name: Run M5 native-desktop qualification contract tests
        run: |
          cargo test -p aureline-shell --test m5_native_desktop_qualification_fixtures

# M5 request/data component certification gate.
#
# Validates the reusable request-editor, response-viewer, connection-browser,
# result-grid, query-history, and explain-plan certification bundle. The gate
# checks matrix/proof/support/fixture parity, schema-backed first-consumer
# fixtures, safe export posture, accessibility/support-join metadata, automatic
# narrowing triggers, and docs references for request, browser-runtime, and
# database consumers.

name: check_m5_request_data_components

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_request_data_components.yml"
      - "tools/ci/m5/request_data_component_check.py"
      - "artifacts/design/m5-request-data-component-matrix.md"
      - "artifacts/release/m5-request-data-component-proof/**"
      - "fixtures/ui/m5-request-data-components/**"
      - "schemas/ui/m5-request-editor-header.schema.json"
      - "schemas/ui/m5-variable-resolution-inspector.schema.json"
      - "schemas/ui/m5-auth-sheet.schema.json"
      - "schemas/ui/m5-response-tabset.schema.json"
      - "schemas/ui/m5-request-history-row.schema.json"
      - "schemas/ui/m5-contract-source-badge.schema.json"
      - "schemas/ui/m5-connection-picker-row.schema.json"
      - "schemas/ui/m5-schema-object-row.schema.json"
      - "schemas/ui/m5-sql-run-bar.schema.json"
      - "schemas/ui/m5-result-grid.schema.json"
      - "schemas/ui/m5-query-history-row.schema.json"
      - "schemas/ui/m5-explain-plan-pane.schema.json"
      - "docs/request-workspace/m5-request-editor-auth-primitives.md"
      - "docs/browser-runtime/m5-request-send-surface-projection.md"
      - "docs/data/database_tooling_contract.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-request-data-components-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_request_data_components:
    name: M5 request/data component certification
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: |
          python3 -m pip install jsonschema

      - name: Run M5 request/data component certification gate
        run: |
          python3 tools/ci/m5/request_data_component_check.py --repo-root .

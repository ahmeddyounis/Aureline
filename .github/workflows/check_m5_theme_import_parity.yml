# M5 theme-package, appearance-session, token-overlay, and import-parity gate.
#
# Validates the checked-in M5 theme-import-parity audit: the frozen object-model
# index names all five canonical appearance-object families (theme package,
# appearance session, token overlay, imported-theme report, extension appearance
# descriptor) and each family's schema exists; every M5 surface that consumes an
# appearance object (shell chrome, docs/help panes, support/export, extension-
# hosted and embedded surfaces, and the marketplace/account/sync settings
# surface) reports the five parity rows with disclosed downgrade truth; a
# downgrade (stale evidence, an unsupported slot, partial inheritance, or a
# restart-or-reload-required change) is honest only when disclosed in product,
# export, and diagnostics; and a hidden downgrade, a silently dropped overlay
# token, a hidden unresolved import mapping, a hidden inheritance gap, a parity
# claim with no report, a missing rollback path, or stale evidence on a marketed
# row is a blocker so release tooling can narrow the row.

name: check_m5_theme_import_parity

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_theme_import_parity.yml"
      - "tools/ci/m5/theme_import_parity_check.py"
      - "schemas/ux/m5-theme-import-parity.schema.json"
      - "docs/m5/theme-package-and-appearance-objects.md"
      - "artifacts/ux/m5/theme-import-parity/**"
      - "fixtures/ux/m5/theme-package-interop/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-theme-import-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_theme_import_parity:
    name: M5 theme import parity
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run M5 theme-import-parity CI gate
        run: |
          python3 tools/ci/m5/theme_import_parity_check.py --repo-root .

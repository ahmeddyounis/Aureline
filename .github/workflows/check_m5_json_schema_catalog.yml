# M5 JSON Schema catalog gate.
#
# Validates the checked-in M5 JSON Schema catalog: every durable M5 artifact
# family the publication matrix puts forward as a JSON-Schema-backed contract
# publishes one checked-in JSON Schema package with an explicit in-band version
# field, a lifecycle/stability label equal to the matrix's effective published
# label, a field-level compatibility contract, an example payload, and a
# round-trip fixture; each package schema is a valid Draft 2020-12 schema that
# preserves unknown fields; each example and round-trip fixture validates against
# its package schema and an undeclared field survives a round-trip. The gate
# confirms the catalog and its packages match their regenerator (no drift), runs
# the Python validator, and runs the typed Rust consumer's tests.

name: check_m5_json_schema_catalog

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_json_schema_catalog.yml"
      - "artifacts/contracts/m5-json-schema-catalog.json"
      - "artifacts/contracts/m5-stability-lifecycle-map.json"
      - "artifacts/contracts/contract_families.yaml"
      - "artifacts/release/captures/implement_canonical_json_schema_packages_explicit_version_fields_and_stability_labels_for_newly_stable_or_beta_m5_durable_artifacts_validation_capture.json"
      - "schemas/public/m5-contracts/m5_json_schema_catalog.schema.json"
      - "schemas/public/m5-json/**"
      - "examples/contracts/m5/json/**"
      - "fixtures/contracts/m5-json-roundtrip/**"
      - "fixtures/contracts/m5-json-catalog/**"
      - "docs/sdk/m5-json-schema-catalog.md"
      - "docs/m5/implement-canonical-json-schema-packages-explicit-version-fields-and-stability-labels-for-newly-stable-or-beta-m5-durable-artifacts.md"
      - "tools/regenerate_m5_json_schema_catalog.py"
      - "tools/validate_m5_json_schema_catalog.py"
      - "crates/aureline-release/src/implement_canonical_json_schema_packages_explicit_version_fields_and_stability_labels_for_newly_stable_or_beta_m5_durable_artifacts/**"
      - "crates/aureline-release/src/lib.rs"
      - "crates/aureline-release/tests/implement_canonical_json_schema_packages_explicit_version_fields_and_stability_labels_for_newly_stable_or_beta_m5_durable_artifacts.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-json-schema-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_json_schema_catalog:
    name: M5 JSON Schema Catalog
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python validator dependencies
        run: python3 -m pip install --upgrade jsonschema PyYAML referencing

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Confirm the catalog matches its regenerator
        run: |
          python3 tools/regenerate_m5_json_schema_catalog.py
          git diff --exit-code -- \
            artifacts/contracts/m5-json-schema-catalog.json \
            schemas/public/m5-json \
            examples/contracts/m5/json \
            fixtures/contracts/m5-json-roundtrip \
            fixtures/contracts/m5-json-catalog \
            docs/sdk/m5-json-schema-catalog.md \
            artifacts/release/captures/implement_canonical_json_schema_packages_explicit_version_fields_and_stability_labels_for_newly_stable_or_beta_m5_durable_artifacts_validation_capture.json

      - name: Validate the M5 JSON Schema catalog
        run: python3 tools/validate_m5_json_schema_catalog.py

      - name: Run M5 JSON Schema catalog contract tests
        run: cargo test -p aureline-release --test implement_canonical_json_schema_packages_explicit_version_fields_and_stability_labels_for_newly_stable_or_beta_m5_durable_artifacts

      - name: Upload validation capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-json-schema-catalog-${{ github.run_id }}
          path: artifacts/release/captures/implement_canonical_json_schema_packages_explicit_version_fields_and_stability_labels_for_newly_stable_or_beta_m5_durable_artifacts_validation_capture.json
          if-no-files-found: error
          retention-days: 30

# M5 CLI/headless structured-output and result-code catalog gate.
#
# Validates the checked-in M5 CLI/headless structured-output and result-code
# catalog: every new M5 CLI/headless inspect, export, report, and health surface
# binds a structured-output schema reference resolved from the M5 JSON Schema
# catalog, a result-code catalog whose codes are members of the closed
# exit_code_class vocabulary, a lifecycle label equal to the publication matrix's
# effective published label, an explicit partial-result/freshness vocabulary, and
# a CLI fixture and a UI inspect fixture proving the lifecycle/degraded-state
# vocabulary is identical on both surfaces. The gate confirms the catalog and its
# fixtures match their regenerator (no drift), runs the Python validator, and runs
# the typed Rust consumer's tests.

name: check_m5_cli_output_catalog

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_cli_output_catalog.yml"
      - "artifacts/contracts/m5-cli-output-catalog.json"
      - "artifacts/contracts/m5-json-schema-catalog.json"
      - "artifacts/contracts/m5-stability-lifecycle-map.json"
      - "artifacts/release/captures/ship_cli_headless_structured_output_schemas_result_code_catalogs_and_schema_reference_links_for_every_new_m5_inspect_export_report_surface_validation_capture.json"
      - "schemas/public/m5-cli/**"
      - "schemas/public/m5-json/**"
      - "schemas/automation/cli_output_registry_entry.schema.json"
      - "fixtures/contracts/m5-cli-json/**"
      - "fixtures/contracts/m5-cli-catalog/**"
      - "docs/cli/m5-structured-output-and-result-codes.md"
      - "docs/m5/ship-cli-headless-structured-output-schemas-result-code-catalogs-and-schema-reference-links-for-every-new-m5-inspect-export-report-surface.md"
      - "tools/regenerate_m5_cli_output_catalog.py"
      - "tools/regenerate_m5_json_schema_catalog.py"
      - "tools/validate_m5_cli_output_catalog.py"
      - "crates/aureline-release/src/ship_cli_headless_structured_output_schemas_result_code_catalogs_and_schema_reference_links_for_every_new_m5_inspect_export_report_surface/**"
      - "crates/aureline-release/src/lib.rs"
      - "crates/aureline-release/tests/ship_cli_headless_structured_output_schemas_result_code_catalogs_and_schema_reference_links_for_every_new_m5_inspect_export_report_surface.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-cli-output-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_cli_output_catalog:
    name: M5 CLI Output Catalog
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python validator dependencies
        run: python3 -m pip install --upgrade jsonschema PyYAML referencing

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Confirm the catalog matches its regenerator
        run: |
          python3 tools/regenerate_m5_cli_output_catalog.py
          git diff --exit-code -- \
            artifacts/contracts/m5-cli-output-catalog.json \
            fixtures/contracts/m5-cli-json \
            fixtures/contracts/m5-cli-catalog \
            docs/cli/m5-structured-output-and-result-codes.md \
            artifacts/release/captures/ship_cli_headless_structured_output_schemas_result_code_catalogs_and_schema_reference_links_for_every_new_m5_inspect_export_report_surface_validation_capture.json

      - name: Validate the M5 CLI output catalog
        run: python3 tools/validate_m5_cli_output_catalog.py

      - name: Run M5 CLI output catalog contract tests
        run: cargo test -p aureline-release --test ship_cli_headless_structured_output_schemas_result_code_catalogs_and_schema_reference_links_for_every_new_m5_inspect_export_report_surface

      - name: Upload validation capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-cli-output-catalog-${{ github.run_id }}
          path: artifacts/release/captures/ship_cli_headless_structured_output_schemas_result_code_catalogs_and_schema_reference_links_for_every_new_m5_inspect_export_report_surface_validation_capture.json
          if-no-files-found: error
          retention-days: 30

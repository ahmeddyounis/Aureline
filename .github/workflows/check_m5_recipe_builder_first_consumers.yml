# M5 recipe-builder first-consumers gate.
#
# Validates the checked-in recipe-builder object and its first consumers: the
# canonical packet binds all six first-consumer entrypoints (notebook,
# task/test/debug, request/API, package, incident, and the AI assistant) to a
# seeded builder that reuses command truth, emits a declarative manifest, keeps
# UI-only steps blocked, and keeps copy-CLI / open-docs parity; the support
# export, CLI/headless view, and compact projection stay consistent; the
# worked-example builder export, blocked session, and reorder demonstration
# exist; and every mutation fixture blocks stable. The typed Rust consumer mints
# the same packet, so `cargo test -p aureline-runtime` enforces the same
# invariants and that the fixtures and artifacts are bit-for-bit derivable from
# the seed.

name: check_m5_recipe_builder_first_consumers

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_recipe_builder_first_consumers.yml"
      - "tools/ci/m5/recipe_builder_first_consumers_check.py"
      - "schemas/automation/recipe-builder-first-consumers.schema.json"
      - "schemas/automation/recipe-builder.schema.json"
      - "docs/m5/recipe-builder.md"
      - "artifacts/m5/automation/recipe-builder-first-consumers/**"
      - "fixtures/automation/m5/recipe-builder/**"
      - "crates/aureline-runtime/src/recipe_builder/**"
      - "crates/aureline-runtime/examples/dump_m5_recipe_builder_first_consumers.rs"
      - "crates/aureline-runtime/src/lib.rs"
      - "crates/aureline-runtime/tests/m5_recipe_builder_first_consumers.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-recipe-builder-first-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_recipe_builder_first_consumers:
    name: M5 recipe-builder first consumers
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 recipe-builder first-consumers CI gate
        run: |
          python3 tools/ci/m5/recipe_builder_first_consumers_check.py --repo-root .

      - name: Run M5 recipe-builder first-consumers contract tests
        run: |
          cargo test -p aureline-runtime --test m5_recipe_builder_first_consumers

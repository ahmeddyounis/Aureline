# M5 live-appearance change & evidence-linkage gate.
#
# Validates the checked-in M5 live-appearance evidence report: every live OS
# theme, contrast, accent, or text-scale change either applies through the
# appearance-session model or carries an explicit restart/reload posture, every
# screenshot and golden capture is attributable to the exact build, theme
# package, and appearance session that produced it, no claimed row survives by
# hiding a trust/severity/lifecycle/focus cue, and no marketed axis passes on a
# single platform or with only a static screenshot. The typed Rust consumer mints
# the same report, so `cargo test -p aureline-shell` enforces the same structural
# invariants and that the fixtures are bit-for-bit equal to the seed.

name: check_m5_live_appearance_evidence

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_live_appearance_evidence.yml"
      - "tools/ci/m5/live_appearance_evidence_check.py"
      - "schemas/ux/m5-live-appearance-evidence.schema.json"
      - "docs/m5/live-appearance-and-evidence-linkage.md"
      - "artifacts/ux/m5/live-appearance-platform-labs/**"
      - "fixtures/ux/m5/os-appearance-contrast-accent/**"
      - "crates/aureline-shell/src/live_appearance_evidence/**"
      - "crates/aureline-shell/src/bin/aureline_shell_m5_live_appearance_evidence.rs"
      - "crates/aureline-shell/src/lib.rs"
      - "crates/aureline-shell/tests/m5_live_appearance_evidence_fixtures.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-live-appearance-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5_live_appearance_evidence:
    name: M5 live-appearance evidence
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run M5 live-appearance evidence CI gate
        run: |
          python3 tools/ci/m5/live_appearance_evidence_check.py --repo-root .

      - name: Run M5 live-appearance evidence contract tests
        run: |
          cargo test -p aureline-shell --test m5_live_appearance_evidence_fixtures

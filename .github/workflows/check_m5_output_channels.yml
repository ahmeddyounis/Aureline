# Output-channel virtualization/trust/freshness gate.
#
# Validates the checked-in output-channel set: the source packet conforms to its
# schema, no channel renders wider than its effective claim, no rendering surface
# overclaims, large logs stay stream-first/searchable/exportable, the safe-preview
# versus active boundary is preserved, provider-backed channels never masquerade as
# live, every payload kind / trust class / rendering surface is represented, and every
# narrowing/floor rule in the perturbation corpus fires as recorded.

name: check_m5_output_channels

on:
  pull_request:
    paths:
      - ".github/workflows/check_m5_output_channels.yml"
      - "tools/release/output_channel_virtualization.py"
      - "schemas/tooling/m5-output-channels.schema.json"
      - "artifacts/tooling/m5-output-channels/**"
      - "fixtures/tooling/m5-output-channels/**"
      - "docs/tooling/m5-output-channels.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-m5-output-channels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  output_channels:
    name: Output channels
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validators
        run: python3 -m pip install --upgrade jsonschema referencing

      - name: Validate the channel set against its schema
        run: |
          python3 - <<'PY'
          import json, jsonschema
          schema = json.load(open("schemas/tooling/m5-output-channels.schema.json"))
          data = json.load(open("artifacts/tooling/m5-output-channels/support_export.json"))
          jsonschema.validate(data, schema)
          print("schema OK")
          PY

      - name: Validate the channel set
        run: python3 tools/release/output_channel_virtualization.py validate

      - name: Run the channel self-test
        run: python3 tools/release/output_channel_virtualization.py self-test

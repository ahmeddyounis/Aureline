[package]
name = "aureline-ui"
description = "Shared UI primitives: semantic tokens, appearance state, and design-system contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Explicit short target names keep rustc object paths below filesystem limits.

[[example]]
name = "dump_m5_collaboration_state_headless_inspect"
path = "examples/dump_m5_collaboration_state_headless_inspect_and_support_bundle_parity_registries.rs"

[[example]]
name = "dump_m5_comment_annotation_review_pin"
path = "examples/dump_m5_comment_annotation_review_pin_anchor_history_and_rebind_review_registries.rs"

[[example]]
name = "dump_m5_stable_line_bundle_refresh"
path = "examples/dump_m5_stable_line_bundle_refresh_audit_and_shipping_line_drift_report_registries.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

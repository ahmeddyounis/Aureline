[package]
name = "aureline-design-system"
description = "Governed design-system beta contracts for component state, appearance, screenshot diff, and token conformance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aureline_design_system_beta_contract"
path = "src/bin/aureline_design_system_beta_contract.rs"

[[bin]]
name = "aureline_design_system_m5_contract_matrix"
path = "src/bin/aureline_design_system_m5_contract_matrix.rs"

[[bin]]
name = "aureline_design_system_m5_foundation_package"
path = "src/bin/aureline_design_system_m5_foundation_package.rs"

[[bin]]
name = "aureline_design_system_m5_component_manifest"
path = "src/bin/aureline_design_system_m5_component_manifest.rs"

[[bin]]
name = "aureline_design_system_m5_reference_layout"
path = "src/bin/aureline_design_system_m5_reference_layout.rs"

[[bin]]
name = "aureline_design_system_m5_style_drift_lint"
path = "src/bin/aureline_design_system_m5_style_drift_lint.rs"

[[bin]]
name = "aureline_design_system_m5_host_primitive"
path = "src/bin/aureline_design_system_m5_host_primitive.rs"

[[bin]]
name = "aureline_design_system_m5_evidence_pack"
path = "src/bin/aureline_design_system_m5_evidence_pack.rs"

[[bin]]
name = "aureline_design_system_m5_surface_qualification"
path = "src/bin/aureline_design_system_m5_surface_qualification.rs"

[[bin]]
name = "aureline_design_system_m5_shared_component_state_matrix"
path = "src/bin/aureline_design_system_m5_shared_component_state_matrix.rs"

[[bin]]
name = "aureline_design_system_m5_interactive_state_contract"
path = "src/bin/aureline_design_system_m5_interactive_state_contract.rs"

[[bin]]
name = "aureline_design_system_m5_selection_or_lock_state_contract"
path = "src/bin/aureline_design_system_m5_selection_or_lock_state_contract.rs"

[lints]
workspace = true

[dependencies]
aureline-ui = { path = "../aureline-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

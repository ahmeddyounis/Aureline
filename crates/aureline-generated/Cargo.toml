[package]
name = "aureline-generated"
description = "Generated-artifact provenance, regeneration, writable-boundary, and reversible-checkpoint governance. Freezes one typed, inspectable matrix that certifies generated-artifact truth per claimed M5 artifact class, with one narrowing engine that downgrades stale or partial evidence, narrows the writable-boundary posture toward a reviewed override or regenerate-only when canonical-source or boundary evidence outruns proof, and withholds claims whose canonical source, regeneration route, drift state, or checkpoint lineage cannot be proven."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

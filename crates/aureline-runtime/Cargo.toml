[package]
name = "aureline-runtime"
description = "Execution-context object model and resolver seed shared by terminal, task, and debug-prep lanes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aureline_runtime_test_explorer_watch_triage_component_matrix"
path = "src/bin/aureline_runtime_test_explorer_watch_triage_component_matrix.rs"

[[bin]]
name = "aureline_runtime_test_tree_row_primitive"
path = "src/bin/aureline_runtime_test_tree_row_primitive.rs"

[[bin]]
name = "aureline_runtime_inline_result_marker_primitive"
path = "src/bin/aureline_runtime_inline_result_marker_primitive.rs"

[[bin]]
name = "aureline_runtime_session_summary_watch_banner_primitive"
path = "src/bin/aureline_runtime_session_summary_watch_banner_primitive.rs"

[lints]
workspace = true

[dependencies]
aureline-language = { path = "../aureline-language" }
aureline-rpc = { path = "../aureline-rpc" }
aureline-workspace = { path = "../aureline-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aureline-terminal = { path = "../aureline-terminal" }
serde_yaml = "0.9"

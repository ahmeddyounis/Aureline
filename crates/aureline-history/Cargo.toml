[package]
name = "aureline-history"
description = "Local-history checkpoints and unified mutation-journal persistence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aureline_history_local_history_write_scope_component_matrix"
path = "src/bin/aureline_history_local_history_write_scope_component_matrix.rs"

[[bin]]
name = "aureline_history_local_history_row_checkpoint_group_card_primitive"
path = "src/bin/aureline_history_local_history_row_checkpoint_group_card_primitive.rs"

[[bin]]
name = "aureline_history_restore_preview_card_restore_granularity_selector_primitive"
path = "src/bin/aureline_history_restore_preview_card_restore_granularity_selector_primitive.rs"

[[bin]]
name = "aureline_history_write_scope_preview_tree_primitive"
path = "src/bin/aureline_history_write_scope_preview_tree_primitive.rs"

[[bin]]
name = "aureline_history_retention_export_card_history_export_manifest_primitive"
path = "src/bin/aureline_history_retention_export_card_history_export_manifest_primitive.rs"

[[bin]]
name = "aureline_history_local_history_write_scope_component_consumers"
path = "src/bin/aureline_history_local_history_write_scope_component_consumers.rs"

[lints]
workspace = true

[dependencies]
aureline-buffer = { path = "../aureline-buffer" }
aureline-records = { path = "../aureline-records" }
aureline-vfs = { path = "../aureline-vfs" }
blake3 = "1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

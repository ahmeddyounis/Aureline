[package]
name = "aureline-ai"
description = "AI composer and context-inspector seed for the bounded launch AI wedge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aureline_ai_execution_replay_component_matrix"
path = "src/bin/aureline_ai_execution_replay_component_matrix.rs"

[[bin]]
name = "aureline_ai_action_state_banner_primitive"
path = "src/bin/aureline_ai_action_state_banner_primitive.rs"

[[bin]]
name = "aureline_ai_connector_detail_row_local_model_pack_card_primitive"
path = "src/bin/aureline_ai_connector_detail_row_local_model_pack_card_primitive.rs"

[[bin]]
name = "aureline_ai_high_friction_approval_sheet_tool_call_timeline_row_primitive"
path = "src/bin/aureline_ai_high_friction_approval_sheet_tool_call_timeline_row_primitive.rs"

[[bin]]
name = "aureline_ai_run_history_approval_timeline_evidence_export_primitive"
path = "src/bin/aureline_ai_run_history_approval_timeline_evidence_export_primitive.rs"

[[bin]]
name = "aureline_ai_rerun_review_incomplete_replay_agent_status_primitive"
path = "src/bin/aureline_ai_rerun_review_incomplete_replay_agent_status_primitive.rs"

[[bin]]
name = "aureline_ai_execution_replay_component_consumers"
path = "src/bin/aureline_ai_execution_replay_component_consumers.rs"

[lints]
workspace = true

[dependencies]
aureline-commands = { path = "../aureline-commands" }
aureline-content-safety = { path = "../aureline-content-safety" }
aureline-docs = { path = "../aureline-docs" }
aureline-git = { path = "../aureline-git" }
aureline-graph = { path = "../aureline-graph" }
aureline-history = { path = "../aureline-history" }
aureline-navigation = { path = "../aureline-navigation" }
aureline-runtime = { path = "../aureline-runtime" }
aureline-search = { path = "../aureline-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aureline-deps = { path = "../aureline-deps" }
aureline-graph-proto = { path = "../aureline-graph-proto" }
aureline-review = { path = "../aureline-review" }
aureline-workspace = { path = "../aureline-workspace" }
serde_yaml = "0.9"

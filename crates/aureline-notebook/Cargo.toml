[package]
name = "aureline-notebook"
description = "Retained notebook preview runtime-truth model: kernel/session/output truth, restart/reconnect review, variable-explorer freshness, rich-output trust classes, debugger-bridge state, round-trip fixtures, heavy-output corpora, share and handoff sheets with scope separation, and canonical support packet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "notebook_output_trust"
path = "tests/materialize_notebook_output_trust_classes_sanitized_or_sandboxed_viewer_lanes_and_large_output_virtualization.rs"

# Explicit short target names keep rustc object paths below macOS filesystem limits.

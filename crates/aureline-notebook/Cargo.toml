[package]
name = "aureline-notebook"
description = "Retained notebook preview runtime-truth model: kernel/session/output truth, restart/reconnect review, variable-explorer freshness, rich-output trust classes, debugger-bridge state, round-trip fixtures, heavy-output corpora, share and handoff sheets with scope separation, and canonical support packet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aureline_notebook_m5_artifact_lineage_panel_result_summary_card_primitive"
path = "src/bin/aureline_notebook_m5_artifact_lineage_panel_result_summary_card_primitive.rs"

[[bin]]
name = "aureline_notebook_m5_dataset_provenance_card_sensitivity_sharing_banner_primitive"
path = "src/bin/aureline_notebook_m5_dataset_provenance_card_sensitivity_sharing_banner_primitive.rs"

[[bin]]
name = "aureline_notebook_m5_experiment_component_consumers"
path = "src/bin/aureline_notebook_m5_experiment_component_consumers.rs"

[[bin]]
name = "aureline_notebook_m5_notebook_kernel_output_component_matrix"
path = "src/bin/aureline_notebook_m5_notebook_kernel_output_component_matrix.rs"

[[bin]]
name = "aureline_notebook_m5_experiment_component_matrix"
path = "src/bin/aureline_notebook_m5_experiment_component_matrix.rs"

[[bin]]
name = "aureline_notebook_m5_experiment_run_row_environment_fingerprint_primitive"
path = "src/bin/aureline_notebook_m5_experiment_run_row_environment_fingerprint_primitive.rs"

[[bin]]
name = "aureline_notebook_m5_run_comparison_table_compare_guard_banner_primitive"
path = "src/bin/aureline_notebook_m5_run_comparison_table_compare_guard_banner_primitive.rs"

[[bin]]
name = "aureline_notebook_m5_notebook_document_header_kernel_state_strip_primitive"
path = "src/bin/aureline_notebook_m5_notebook_document_header_kernel_state_strip_primitive.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_yaml = "0.9"

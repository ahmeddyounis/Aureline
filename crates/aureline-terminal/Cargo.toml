[package]
name = "aureline-terminal"
description = "Terminal foundation: PTY host abstraction and session-header truth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Explicit short target names keep rustc object paths below macOS filesystem limits.
[[test]]
name = "term_it_01_stabilize_integrated_terminal_boundaries"
path = "tests/stabilize_integrated_terminal_boundaries_clipboard_posture_transcript_export_truth_packet.rs"

[lints]
workspace = true

[dependencies]
aureline-workspace = { path = "../aureline-workspace" }
portable-pty = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

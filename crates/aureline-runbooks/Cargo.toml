[package]
name = "aureline-runbooks"
description = "Governed runbook object model freezing source classes, executable step classes, deviation lineage, control-plane handoff, and archival/export truth across claimed incident/operator surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aureline_runbooks_m5_runbook_governance"
path = "src/bin/aureline_runbooks_m5_runbook_governance.rs"

[[bin]]
name = "aureline_runbooks_m5_runbook_sources"
path = "src/bin/aureline_runbooks_m5_runbook_sources.rs"

[[bin]]
name = "aureline_runbooks_m5_runbook_steps"
path = "src/bin/aureline_runbooks_m5_runbook_steps.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

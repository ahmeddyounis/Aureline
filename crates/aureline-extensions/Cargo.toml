[package]
name = "aureline-extensions"
description = "Extension-manifest baseline, effective-permission summary, and install / review decision validator for the first ecosystem-bearing lane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Explicit short target names keep rustc object paths below macOS filesystem limits.
[[test]]
name = "ext_it_01_implement_versioned_wit_packages"
path = "tests/implement_versioned_wit_packages_host_guest_negotiation_fixtures_and_capability_diff_reports_for_m5_wasm_extension_and_bridge_backed_public_contracts.rs"

[lints]
workspace = true

[dependencies]
aureline-auth = { path = "../aureline-auth" }
aureline-content-safety = { path = "../aureline-content-safety" }
aureline-i18n = { path = "../aureline-i18n" }
aureline-install = { path = "../aureline-install" }
aureline-provider = { path = "../aureline-provider" }
aureline-runtime = { path = "../aureline-runtime" }
aureline-search = { path = "../aureline-search" }
aureline-support = { path = "../aureline-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

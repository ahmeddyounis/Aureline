font8x8 = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
softbuffer = "0.4"
unicode-segmentation = "1"
webbrowser = "=1.1.0"
winit = { version = "0.29", features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.14.1", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.14.1", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[test]]
name = "shell_bootstrap_matrix"
path = "../../tests/smoke/shell_bootstrap_matrix/shell_bootstrap_matrix.rs"

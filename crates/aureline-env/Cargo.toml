[package]
name = "aureline-env"
description = "Environment-capsule, workspace-template, prebuild-fingerprint, and runtime-materialization governance. Freezes one typed, inspectable matrix that certifies environment-capsule truth per claimed M5 template/starter/prebuild/devcontainer/remote/managed profile, with one narrowing engine that downgrades stale or partial evidence, narrows warm-start reuse when a prebuild outruns its source digest, and withholds unproven dimensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

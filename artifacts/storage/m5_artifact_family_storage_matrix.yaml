# Frozen storage-class, pin-source, clear-data, and low-disk ordering matrix
# for the heavy artifact families that the M5 depth lanes add.
#
# This artifact is a human-meaningful mapping layer over the already-frozen
# runtime storage-class vocabulary in artifacts/runtime/storage_classes.yaml.
# It mints NO new storage_class_id, authority_class, rebuild_cost_class,
# gc_policy_class, pin_source_class, clear_cache_protection_class, or
# low_disk_ladder_step values. Every row projects back to one of the six
# frozen storage classes; the default_retention_class and
# clear_data_action_class vocabularies are the only new sets, and they are
# bounded explanatory labels rather than storage primitives.
#
# Every heavy artifact family the M5 lanes create (notebook outputs,
# profiler traces, replay bundles, docs/model/template packs, generated
# previews, extension downloads, prebuild layers, support artifacts, and
# review/incident evidence) plus the user-owned recovery state those lanes
# touch is listed here exactly once. Inspectors, low-disk banners, the
# clear-data review sheet, the cleanup-history lane, offboarding/reset, and
# support/export packets MUST project these rows rather than invent a
# surface-local cleanup vocabulary.

schema_version: 1
record_kind: m5_artifact_family_storage_matrix
matrix_id: aureline.storage.m5_artifact_family_storage_matrix.v1
title: M5 heavy-artifact-family storage-class, pin-source, clear-data, and low-disk matrix
schema_ref: schemas/storage/m5_artifact_family_storage_matrix.schema.json
doc_ref: docs/m5/freeze-the-m5-storage-class-pin-source-clear-data-and-low-disk-ordering-matrix-for-new-artifact-families.md
runtime_storage_classes_ref: artifacts/runtime/storage_classes.yaml
emitted_at: 2026-06-14T00:00:00Z

rows:
  # ---- Disposable / rebuildable derived caches ----------------------------
  - schema_version: 1
    record_kind: m5_artifact_family_storage_row
    family_id: generated_preview
    label: Generated previews
    summary: >
      Rendered Markdown/HTML previews, diagram renders, and other ephemeral
      preview output regenerated on demand from authoritative source.
    storage_class_id: interactive_hot_cache
    authority_class: disposable_derived_cache
    rebuild_cost_class: low_rebuild_cost
    gc_policy_class: gc_on_pressure_if_unpinned
    default_retention_class: evict_on_session_end
    clear_cache_protection_class: generic_clear_always_allowed
    low_disk_ladder_step: trim_interactive_hot_cache
    pin_source_classes: []
    allowed_clear_data_actions:
      - generic_clear_in_bulk
    export_before_delete_required: false
    protected_continuity: false
    schema_ref: schemas/storage/m5_artifact_family_storage_matrix.schema.json
    doc_ref: docs/m5/freeze-the-m5-storage-class-pin-source-clear-data-and-low-disk-ordering-matrix-for-new-artifact-families.md

  - schema_version: 1
    record_kind: m5_artifact_family_storage_row
    family_id: notebook_output
    label: Notebook outputs
    summary: >
      Cached notebook cell outputs (rendered results, captured stdout, and
      output blobs). Rebuildable by re-executing the notebook; large and
      derived, never authoritative on its own.
    storage_class_id: artifact_cache
    authority_class: disposable_derived_cache
    rebuild_cost_class: high_rebuild_cost
    gc_policy_class: gc_on_pressure_if_unpinned
    default_retention_class: evict_under_pressure_if_unpinned
    clear_cache_protection_class: generic_clear_with_pin_exclusions
    low_disk_ladder_step: trim_artifact_cache_unpinned
    pin_source_classes:
      - explicit_user_pin
    allowed_clear_data_actions:
      - generic_clear_excluding_pins
      - class_selective_clear
    export_before_delete_required: false
    protected_continuity: false
    schema_ref: schemas/storage/m5_artifact_family_storage_matrix.schema.json
    doc_ref: docs/m5/freeze-the-m5-storage-class-pin-source-clear-data-and-low-disk-ordering-matrix-for-new-artifact-families.md


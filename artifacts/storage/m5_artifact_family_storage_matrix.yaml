  # ---- User-owned recovery state ------------------------------------------
  - schema_version: 1
    record_kind: m5_artifact_family_storage_row
    family_id: user_owned_recovery_state
    label: User-owned recovery state
    summary: >
      Local history, rollback checkpoints, dirty-buffer journals, and
      session-restore state touched by M5 lanes. Authoritative user-owned
      state; never trimmed by default and never eligible for generic clear.
    storage_class_id: user_owned_recovery_state
    authority_class: user_owned_recovery_state
    rebuild_cost_class: authoritative_no_rebuild
    gc_policy_class: gc_on_explicit_reset_only
    default_retention_class: retain_until_explicit_user_reset
    clear_cache_protection_class: protected_never_generic_clear
    low_disk_ladder_step: user_owned_recovery_state_only_under_explicit_review
    pin_source_classes:
      - explicit_user_pin
      - retention_window_ref
    allowed_clear_data_actions:
      - explicit_per_item_review_required
      - export_before_delete_offered
    export_before_delete_required: true
    protected_continuity: true
